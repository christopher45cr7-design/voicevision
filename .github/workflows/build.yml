name: Build VisionVoice APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -q "*.zip"
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build with Gradle
      run: |
        GRADLEW_DIR=$(find . -name "gradlew" -exec dirname {} + | head -n 1)
        cd "$GRADLEW_DIR"
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VisionVoice-App
        path: "**/build/outputs/apk/debug/*.apk"
